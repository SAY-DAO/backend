  <div id="container" style="
        direction: rtl;
        margin: 0;
        position: relative;
        width: 100%;
        background-color: #f3f3f3;
        /* display: flex;
            -webkit-display: flex;
            -moz-display: flex;
            -ms-display: flex;
            -o-display: flex; */
        flex-direction: column;
        -webkit-flex-direction: column;
        -moz-flex-direction: column;
        -ms-flex-direction: column;
        -o-flex-direction: column;
        justify-content: center;
        -webkit-justify-content: center;
        -moz-justify-content: center;
        -ms-justify-content: center;
        -o-justify-content: center;
      ">
    <!--the main content-->
    <div id="content" style="
          width: 600px;
          min-height: 250px;
          background-color: #ffffff;
          margin: 0 auto;
          /* padding-bottom: 20px; */
          padding-top: 50px;
          /* display: flex;
                -webkit-display: flex;
                -moz-display: flex;
                -ms-display: flex;
                -o-display: flex; */
          flex-direction: column;
          -webkit-flex-direction: column;
          -moz-flex-direction: column;
          -ms-flex-direction: column;
          -o-flex-direction: column;
          justify-content: center;
          -webkit-justify-content: center;
          -moz-justify-content: center;
          -ms-justify-content: center;
          -o-justify-content: center;
          box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.08);
          -webkit-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.08);
          -moz-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.08);
          -ms-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.08);
          -o-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.08);
          text-align: center;
        ">
      {% block img %}{% endblock %}

      <!-- the title content -->
      <p id="subject" style="
            font-size: 16px;
            font-weight: bold;
            margin: 20px 0;
            padding: 0 10px;
            color: #515151;
            direction: rtl;
            font-family: iranyekan, Tahoma;
          ">
        {% block tcontent %}{% endblock %}
      </p>

      <!--the main paragraph-->

      <p style="
            margin: 0;
            mso-line-height-rule: exactly;
            line-height: 21px;
            letter-spacing: 0;
            font-size: 14px;
            padding-left: 20px;
            padding-right: 20px;
            color: #515151;
            direction: rtl;
            font-family: iranyekan, Tahoma;
          ">
        {% block mcontent %}{% endblock %}
      </p>

      <!-- Listen to you -->
      <p style="
            font-size: 12px;
            font-weight: lighter;
            margin-top: 20px;
            margin-bottom: 0px;
            padding-top: 0px;
            padding-bottom: 0px;
            padding: 0 10px;
            color: #515151;
            direction: rtl;
            padding-left: 20px;
            padding-right: 20px;
            font-family: iranyekan, Tahoma;
          ">
        ما به شما گوش می‌دهیم، با ما تماس بگیرید.
      </p>
      <p style="
            font-size: 12px;
            font-weight: lighter;
            color: #515151;
            direction: rtl;
            margin-top: 0px;
            margin-bottom: 0px;
            font-family: iranyekan, Tahoma;
          ">
        info@saydao.org </p>
    </div>
  </div>
