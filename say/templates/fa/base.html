<!DOCTYPE html>
<html>

<head>
  <link href="https://api.sayapp.company/public/resources/font/iranyekan/css/fontiran.css" rel="stylesheet" type="text/css"  />
  <link href="https://fonts.googleapis.com/css?family=Roboto:100,400&display=swap" rel="stylesheet" type="text/css" />
  <title>{% block title %}{% endblock %}</title>
  <style>

    body {
      font-family: 'iranyekan !important';
    }
  </style>
</head>

<body style="
      padding: 0;
      margin: 0;
      background-color: #f3f3f3;
      font-family: iranyekan2, Tahoma;
    ">
  <div dir="ltr" class="es-wrapper-color" lang="fa" style="background-color: #fafafa">
    <table width="100%" cellspacing="0" cellpadding="0" class="es-wrapper" role="none" style="
          mso-table-lspace: 0pt;
          mso-table-rspace: 0pt;
          border-collapse: collapse;
          border-spacing: 0px;
          padding: 0;
          margin: 0;
          width: 100%;
          height: 100%;
          background-repeat: repeat;
          background-position: center top;
          background-color: #fafafa;
        ">
      <tr>
        <td valign="top" style="padding: 0; margin: 0">
          <table cellpadding="0" cellspacing="0" align="center" class="i" role="none" style="
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
                border-collapse: collapse;
                border-spacing: 0px;
                width: 100%;
                table-layout: fixed !important;
                background-color: transparent;
                background-repeat: repeat;
                background-position: center top;
              ">
            <tr>
              <td align="center" style="padding: 0; margin: 0">
                <table bgcolor="#ffffff" align="center" cellpadding="0" cellspacing="0" class="bb" role="none" style="
                      mso-table-lspace: 0pt;
                      mso-table-rspace: 0pt;
                      border-collapse: collapse;
                      border-spacing: 0px;
                      background-color: transparent;
                      width: 600px;
                    ">
                  <tr>
                    <td align="left" style="padding: 0; margin: 0">
                      <table cellpadding="0" cellspacing="0" width="100%" role="none" style="
                            mso-table-lspace: 0pt;
                            mso-table-rspace: 0pt;
                            border-collapse: collapse;
                            border-spacing: 0px;
                          ">
                        <tr>
                          <td valign="top" align="center" class="be" style="padding: 0; margin: 0; width: 600px">
                            <table bgcolor="#ffffff" cellpadding="0" cellspacing="0" width="100%" style="
                                  mso-table-lspace: 0pt;
                                  mso-table-rspace: 0pt;
                                  border-collapse: collapse;
                                  border-spacing: 0px;
                                  background-color: #ffffff;
                                " role="presentation">
                              <tr>
                                <td align="center" style="
                                      padding: 0;
                                      margin: 0;
                                      padding-top: 20px;
                                      padding-bottom: 10px;
                                      font-size: 0px;
                                    ">
                                  <a target="_blank" href="https://saydao.org" style="
                                        mso-line-height-rule: exactly;
                                        text-decoration: none;
                                        color: #666666;
                                        font-size: 44px;
                                        font-family: Exodar-outline !important;
                                      ">SAY DAO</a>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
          <table cellpadding="0" cellspacing="0" align="center" class="h" role="none" style="
                mso-table-lspace: 0pt;
                mso-table-rspace: 0pt;
                border-collapse: collapse;
                border-spacing: 0px;
                width: 100%;
                table-layout: fixed !important;
              ">
            <tr>
              <td align="center" style="padding: 0; margin: 0">
                <table cellspacing="0" bgcolor="#ffffff" align="center" cellpadding="0" class="ba" role="none" style="
                      mso-table-lspace: 0pt;
                      mso-table-rspace: 0pt;
                      border-collapse: collapse;
                      border-spacing: 0px;
                      background-color: #ffffff;
                      width: 600px;
                    ">
                  <tr>
                    <td align="left" style="
                          margin: 0;
                          padding-top: 20px;
                          padding-right: 20px;
                          padding-bottom: 35px;
                          padding-left: 20px;
                        ">
                      <!--[if mso]><table style="width:560px" cellpadding="0" cellspacing="0"><tr><td style="width:190px" valign="top"><![endif]-->
                      <table cellpadding="0" cellspacing="0" align="left" class="l" role="none" style="
                            mso-table-lspace: 0pt;
                            mso-table-rspace: 0pt;
                            border-collapse: collapse;
                            border-spacing: 0px;
                            float: left;
                          ">
                        <tr>
                          <td align="left" style="padding: 0; margin: 0; width: 190px">
                            <table cellspacing="0" width="100%" role="presentation" cellpadding="0" style="
                                  mso-table-lspace: 0pt;
                                  mso-table-rspace: 0pt;
                                  border-collapse: collapse;
                                  border-spacing: 0px;
                                ">
                              <tr>
                                <td align="center" style="padding: 0; margin: 0">
                                  <span class="s" style="
                                        border-style: solid;
                                        border-color: #2cb543;
                                        background: transparent;
                                        border-width: 0px;
                                        display: inline-block;
                                        border-radius: 0px;
                                        width: auto;
                                      "><a href="https://docs.saydao.org" dir="rtl" target="_blank" class="o o-9299"
                                      style="
                                          mso-style-priority: 100 !important;
                                          text-decoration: none !important;
                                          mso-line-height-rule: exactly;
                                          color: #666666;
                                          font-size: 14px;
                                          padding: 10px 30px 10px 30px;
                                          display: inline-block;
                                          background: transparent;
                                          border-radius: 0px;
                                          font-family: arial, 'helvetica neue',
                                            helvetica, sans-serif;
                                          font-weight: normal;
                                          font-style: normal;
                                          line-height: 16.8px;
                                          width: auto;
                                          text-align: center;
                                          letter-spacing: 0;
                                          mso-padding-alt: 0;
                                          mso-border-alt: 10px solid transparent;
                                        ">مستندات</a></span>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>
                      <!--[if mso]></td><td style="width:185px" valign="top"><![endif]-->
                      <table cellpadding="0" cellspacing="0" align="left" class="l" role="none" style="
                            mso-table-lspace: 0pt;
                            mso-table-rspace: 0pt;
                            border-collapse: collapse;
                            border-spacing: 0px;
                            float: left;
                          ">
                        <tr>
                          <td align="left" style="padding: 0; margin: 0; width: 185px">
                            <table width="100%" role="presentation" cellpadding="0" cellspacing="0" style="
                                  mso-table-lspace: 0pt;
                                  mso-table-rspace: 0pt;
                                  border-collapse: collapse;
                                  border-spacing: 0px;
                                ">
                              <tr>
                                <td align="center" style="padding: 0; margin: 0">
                                  <span class="s" style="
                                        border-style: solid;
                                        border-color: #2cb543;
                                        background: transparent;
                                        border-width: 0px;
                                        display: inline-block;
                                        border-radius: 0px;
                                        width: auto;
                                      "><a dir="rtl" target="_blank" href="https://dapp.saydao.org" class="o o-9932"
                                      style="
                                          mso-style-priority: 100 !important;
                                          text-decoration: none !important;
                                          mso-line-height-rule: exactly;
                                          color: #666666;
                                          font-size: 14px;
                                          padding: 10px 30px 10px 30px;
                                          display: inline-block;
                                          background: transparent;
                                          border-radius: 0px;
                                          font-family: arial, 'helvetica neue',
                                            helvetica, sans-serif;
                                          font-weight: normal;
                                          font-style: normal;
                                          line-height: 16.8px;
                                          width: auto;
                                          text-align: center;
                                          letter-spacing: 0;
                                          mso-padding-alt: 0;
                                          mso-border-alt: 10px solid transparent;
                                        ">دپلیکیشن</a></span>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>
                      <!--[if mso]></td><td style="width:0px"></td><td style="width:185px" valign="top"><![endif]-->
                      <table cellpadding="0" cellspacing="0" align="right" class="m" role="none" style="
                            mso-table-lspace: 0pt;
                            mso-table-rspace: 0pt;
                            border-collapse: collapse;
                            border-spacing: 0px;
                            float: right;
                          ">
                        <tr>
                          <td align="left" style="padding: 0; margin: 0; width: 185px">
                            <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="
                                  mso-table-lspace: 0pt;
                                  mso-table-rspace: 0pt;
                                  border-collapse: collapse;
                                  border-spacing: 0px;
                                ">
                              <tr>
                                <td align="center" style="padding: 0; margin: 0">
                                  <span class="s" style="
                                        border-style: solid;
                                        border-color: #2cb543;
                                        background: transparent;
                                        border-width: 0px;
                                        display: inline-block;
                                        border-radius: 0px;
                                        width: auto;
                                      "><a href="https://say.company" dir="rtl" target="_blank" class="o o-2460" style="
                                          mso-style-priority: 100 !important;
                                          text-decoration: none !important;
                                          mso-line-height-rule: exactly;
                                          color: #666666;
                                          font-size: 14px;
                                          padding: 10px 30px 10px 30px;
                                          display: inline-block;
                                          background: transparent;
                                          border-radius: 0px;
                                          font-family: arial, 'helvetica neue',
                                            helvetica, sans-serif;
                                          font-weight: normal;
                                          font-style: normal;
                                          line-height: 16.8px;
                                          width: auto;
                                          text-align: center;
                                          letter-spacing: 0;
                                          mso-padding-alt: 0;
                                          mso-border-alt: 10px solid transparent;
                                        ">وبسایت</a></span>
                                </td>
                              </tr>
                            </table>
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>

                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </div>
  <!--the whole container-->
  <div id="container" style="
        direction: rtl;
        margin: 0;
        position: relative;
        width: 100%;
        background-color: #f3f3f3;
        /* display: flex;
            -webkit-display: flex;
            -moz-display: flex;
            -ms-display: flex;
            -o-display: flex; */
        flex-direction: column;
        -webkit-flex-direction: column;
        -moz-flex-direction: column;
        -ms-flex-direction: column;
        -o-flex-direction: column;
        justify-content: center;
        -webkit-justify-content: center;
        -moz-justify-content: center;
        -ms-justify-content: center;
        -o-justify-content: center;
      ">
    <!--the main content-->
    <div id="content" style="
          width: 600px;
          min-height: 250px;
          background-color: #ffffff;
          margin: 0 auto;
          /* padding-bottom: 20px; */
          padding-top: 50px;
          /* display: flex;
                -webkit-display: flex;
                -moz-display: flex;
                -ms-display: flex;
                -o-display: flex; */
          flex-direction: column;
          -webkit-flex-direction: column;
          -moz-flex-direction: column;
          -ms-flex-direction: column;
          -o-flex-direction: column;
          justify-content: center;
          -webkit-justify-content: center;
          -moz-justify-content: center;
          -ms-justify-content: center;
          -o-justify-content: center;
          box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.08);
          -webkit-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.08);
          -moz-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.08);
          -ms-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.08);
          -o-box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.08);
          text-align: center;
        ">
      {% block img %}{% endblock %}

      <!-- the title content -->
      <p id="subject" style="
            font-size: 16px;
            font-weight: bold;
            margin: 20px 0;
            padding: 0 10px;
            color: #515151;
            direction: rtl;
            font-family: iranyekan, Tahoma;
          ">
        {% block tcontent %}{% endblock %}
      </p>

      <!--the main paragraph-->
      <p style="
            font-size: 14px;
            font-weight: lighter;
            max-width: 500px;
            margin: 30px auto;
            padding: 0 10px;
            color: #515151;
            direction: rtl;
            font-family: iranyekan, Tahoma;
          ">
        {% block mcontent %}{% endblock %}
      </p>

      <!-- Listen to you -->
      <p style="
            font-size: 12px;
            font-weight: lighter;
            margin-top: 20px;
            margin: 10px 0;
            padding: 0 10px;
            color: #515151;
            direction: rtl;
            font-family: iranyekan, Tahoma;
          ">
        ما به شما گوش می‌دهیم، با ما تماس بگیرید.
      </p>
      <p style="
            font-size: 12px;
            font-weight: lighter;
            color: #515151;
            direction: rtl;
            font-family: iranyekan, Tahoma;
          ">
        info@saydao.org </p>
    </div>
  </div>
</body>

</html>
